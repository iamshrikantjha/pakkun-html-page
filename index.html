<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pakkun Web Receiver</title>
  <!-- Google Cast Application Framework (CAF) Receiver SDK -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      transition: background-color 0.5s ease;
    }
    .card {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 1;
    }
    .logo {
      width: 140px;
      height: 140px;
      background-color: #2563EB;
      border-radius: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #FFFFFF;
      font-size: 48px;
      font-weight: bold;
      margin: 0 auto 24px auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h1 {
      color: #FFFFFF;
      font-size: 44px;
      margin: 0 0 8px 0;
    }
    p {
      color: #CBD5E1;
      font-size: 22px;
      margin: 0 0 16px 0;
    }
    .status {
      font-size: 18px;
      color: #38BDF8;
      font-weight: bold;
      font-family: monospace;
    }
    #remoteVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background-color: #000;
      z-index: 100;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="logo">P</div>
    <h1>Pakkun Receiver</h1>
    <p id="subTitle">Custom Channel Active</p>
    <div id="statusText" class="status">Waiting for phone messages...</div>
  </div>

  <video id="remoteVideo" autoplay playsinline></video>

  <script>
    const CUSTOM_NAMESPACE = 'urn:x-cast:com.pakkun.channel';
    const context = cast.framework.CastReceiverContext.getInstance();
    const statusEl = document.getElementById('statusText');
    const remoteVideo = document.getElementById('remoteVideo');
    const mainCard = document.getElementById('mainCard');

    let pc = null;
    let senderId = null;
    let pendingCandidates = [];

    function initPeerConnection(sender) {
      if (pc) {
        try { pc.close(); } catch(e){}
      }

      senderId = sender;
      pendingCandidates = [];

      try {
        remoteVideo.pause();
        remoteVideo.srcObject = null;
      } catch(e){}
      remoteVideo.style.display = 'none';
      mainCard.style.display = 'block';

      const config = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      };

      pc = new RTCPeerConnection(config);

      pc.onicecandidate = (event) => {
        if (event.candidate && senderId) {
          console.log('Sending TV ICE candidate:', event.candidate);
          context.sendCustomMessage(CUSTOM_NAMESPACE, senderId, {
            type: 'ice_candidate',
            candidate: JSON.stringify(event.candidate)
          });
        }
      };

      pc.onconnectionstatechange = () => {
        console.log('WebRTC Connection State:', pc.connectionState);
        statusEl.innerText = `WebRTC State: ${pc.connectionState}`;

        if (pc.connectionState === 'connected') {
          statusEl.innerText = 'P2P WebRTC Connected! Live Stream Active.';
          remoteVideo.style.display = 'block';
          mainCard.style.display = 'none';
        } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          remoteVideo.style.display = 'none';
          mainCard.style.display = 'block';
        }
      };

      pc.ontrack = (event) => {
        console.log('Received Remote Track:', event.track.kind, event.streams);
        
        let stream = remoteVideo.srcObject;
        if (!stream || !(stream instanceof MediaStream)) {
          stream = new MediaStream();
          remoteVideo.srcObject = stream;
        }

        if (event.streams && event.streams[0]) {
          event.streams[0].getTracks().forEach(t => {
            if (!stream.getTracks().some(existing => existing.id === t.id)) {
              stream.addTrack(t);
            }
          });
        } else {
          if (!stream.getTracks().some(existing => existing.id === event.track.id)) {
            stream.addTrack(event.track);
          }
        }

        remoteVideo.muted = false;
        remoteVideo.style.display = 'block';
        mainCard.style.display = 'none';
        remoteVideo.play().catch(err => console.error('Video play error:', err));
        statusEl.innerText = `Live Stream Active (${stream.getTracks().length} tracks)`;
      };
    }

    // Register custom message listener for Cast signaling
    context.addCustomMessageListener(CUSTOM_NAMESPACE, async (event) => {
      console.log('Received Cast message:', event);
      senderId = event.senderId;

      try {
        const payload = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;

        if (payload.color) {
          document.body.style.backgroundColor = payload.color;
          statusEl.innerText = `Background: ${payload.color}`;
          remoteVideo.style.display = 'none';
          mainCard.style.display = 'block';
        } 
        else if (payload.type === 'offer') {
          console.log('Processing SDP Offer...');
          statusEl.innerText = 'Received SDP Offer, creating Answer...';
          initPeerConnection(event.senderId);

          const offer = new RTCSessionDescription({
            type: 'offer',
            sdp: payload.sdp
          });

          await pc.setRemoteDescription(offer);

          // Flush any buffered ICE candidates received before SDP offer
          for (const cand of pendingCandidates) {
            await pc.addIceCandidate(cand);
          }
          pendingCandidates = [];

          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          console.log('Sending SDP Answer back to sender...');
          context.sendCustomMessage(CUSTOM_NAMESPACE, event.senderId, {
            type: 'answer',
            sdp: answer.sdp
          });
          statusEl.innerText = 'SDP Answer Sent! Establishing P2P link...';
        } 
        else if (payload.type === 'ice_candidate') {
          const candidateData = typeof payload.candidate === 'string' 
            ? JSON.parse(payload.candidate) 
            : payload.candidate;
          const candidate = new RTCIceCandidate(candidateData);

          if (pc && pc.remoteDescription && pc.remoteDescription.type) {
            await pc.addIceCandidate(candidate);
          } else {
            pendingCandidates.push(candidate);
          }
        }
        else if (payload.type === 'stop') {
          if (pc) {
            pc.close();
            pc = null;
          }
          try {
            remoteVideo.pause();
            remoteVideo.srcObject = null;
          } catch(e){}
          remoteVideo.style.display = 'none';
          mainCard.style.display = 'block';
          statusEl.innerText = 'Stream stopped';
        }

      } catch (err) {
        console.error('Error handling message:', err);
        statusEl.innerText = `Error: ${err.message}`;
      }
    });

    context.start();
  </script>
</body>
</html>

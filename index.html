<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pakkun Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    /* Fullscreen video sink — the ONLY visual layer */
    #remoteVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
      z-index: 1;
    }

    /* Waiting state shown before WebRTC stream arrives */
    #waitingScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #1E293B, #0F172A);
      color: #94A3B8;
      font-size: 20px;
      gap: 16px;
      transition: opacity 0.5s ease;
    }
    #waitingScreen .logo {
      font-size: 64px;
      font-weight: 900;
      background: linear-gradient(135deg, #38BDF8, #818CF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #waitingScreen .pulse {
      width: 12px; height: 12px;
      background: #38BDF8;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* TV-side cursor overlay — rendered on top of video */
    #tvCursor {
      position: fixed;
      width: 24px;
      height: 24px;
      z-index: 100;
      pointer-events: none;
      transition: left 0.03s linear, top 0.03s linear;
      display: none;
    }
    #tvCursor::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 0; height: 0;
      border-left: 10px solid #FFFFFF;
      border-right: 10px solid transparent;
      border-bottom: 16px solid transparent;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    #tvCursor.clicking::after {
      content: '';
      position: absolute;
      top: -8px; left: -8px;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.6);
      animation: clickRipple 0.3s ease-out forwards;
    }
    @keyframes clickRipple {
      0% { transform: scale(0.3); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* Debug info (bottom-right, semi-transparent) */
    #debugInfo {
      position: fixed;
      bottom: 8px; right: 12px;
      z-index: 50;
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- Waiting screen shown until WebRTC stream arrives -->
  <div id="waitingScreen">
    <div class="logo">Pakkun</div>
    <div>Waiting for phone to connect...</div>
    <div class="pulse"></div>
  </div>

  <!-- Fullscreen video sink for WebRTC stream from phone -->
  <video id="remoteVideo" autoplay playsinline muted></video>

  <!-- TV-side cursor overlay -->
  <div id="tvCursor"></div>

  <!-- Debug info -->
  <div id="debugInfo">Pakkun Receiver v2.0 | Idle</div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    //  Pakkun Cast Receiver — Dumb Video Sink
    //  Per VIRTUAL_DESKTOP.md Section 2:
    //    "The receiver has no desktop-rendering logic of its own —
    //     it is a dumb video sink plus a thin input-forwarding layer."
    // ═══════════════════════════════════════════════════════════════

    const CUSTOM_NAMESPACE = 'urn:x-cast:com.pakkun.channel';
    const context = cast.framework.CastReceiverContext.getInstance();

    const remoteVideo = document.getElementById('remoteVideo');
    const waitingScreen = document.getElementById('waitingScreen');
    const tvCursor = document.getElementById('tvCursor');
    const debugInfo = document.getElementById('debugInfo');

    let pc = null;
    let cursorX = 0;
    let cursorY = 0;
    let streamActive = false;

    function setDebug(msg) {
      debugInfo.textContent = `Pakkun Receiver v2.0 | ${msg}`;
    }

    // ─── WebRTC Offer Handler ───────────────────────────────────
    async function handleOffer(offerSdp, senderId) {
      console.log('[Receiver] Received WebRTC offer from phone');
      setDebug('Connecting...');

      // Clean up any existing connection
      if (pc) {
        try { pc.close(); } catch (e) {}
        pc = null;
      }

      pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      });

      pc.ontrack = (event) => {
        console.log('[Receiver] Received track:', event.track.kind);
        remoteVideo.srcObject = event.streams[0];

        // Hide waiting screen, show video
        waitingScreen.style.opacity = '0';
        setTimeout(() => { waitingScreen.style.display = 'none'; }, 500);

        // Show cursor
        tvCursor.style.display = 'block';
        cursorX = window.innerWidth / 2;
        cursorY = window.innerHeight / 2;
        tvCursor.style.left = cursorX + 'px';
        tvCursor.style.top = cursorY + 'px';
        streamActive = true;

        remoteVideo.play().then(() => {
          // Unmute after play starts (autoplay policy)
          remoteVideo.muted = false;
          setDebug('Streaming');
          console.log('[Receiver] Video playing, audio unmuted');
        }).catch(err => {
          console.error('[Receiver] Play error:', err);
          setDebug('Play error: ' + err.message);
        });
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          context.sendCustomMessage(CUSTOM_NAMESPACE, senderId, {
            type: 'ice_candidate',
            candidate: event.candidate
          });
        }
      };

      pc.oniceconnectionstatechange = () => {
        console.log('[Receiver] ICE state:', pc.iceConnectionState);
        setDebug('ICE: ' + pc.iceConnectionState);

        if (pc.iceConnectionState === 'disconnected') {
          // Feature J: Attempt reconnection after brief disconnect
          setDebug('Reconnecting...');
          setTimeout(() => {
            if (pc && pc.iceConnectionState === 'disconnected') {
              console.log('[Receiver] ICE still disconnected, requesting re-offer');
              if (lastSenderId) {
                context.sendCustomMessage(CUSTOM_NAMESPACE, lastSenderId, {
                  type: 'reconnect_request'
                });
              }
            }
          }, 3000);
        }

        if (pc.iceConnectionState === 'failed') {
          streamActive = false;
          tvCursor.style.display = 'none';
          waitingScreen.style.display = 'flex';
          waitingScreen.style.opacity = '1';
          setDebug('Connection lost');
        }
      };

      try {
        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: offerSdp }));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        context.sendCustomMessage(CUSTOM_NAMESPACE, senderId, {
          type: 'answer',
          sdp: answer.sdp
        });
        console.log('[Receiver] Sent SDP answer back to phone');
      } catch (err) {
        console.error('[Receiver] WebRTC negotiation error:', err);
        setDebug('Error: ' + err.message);
      }
    }

    // ─── Input Forwarding ───────────────────────────────────────
    // TV-side pointer/click events → normalized coordinates → phone
    // The phone's AccessibilityService injects the tap on the real display

    function sendTapToPhone(xPercent, yPercent, senderId) {
      try {
        context.sendCustomMessage(CUSTOM_NAMESPACE, senderId, {
          type: 'remote_tap',
          xPercent: xPercent,
          yPercent: yPercent
        });
        console.log(`[Receiver] Sent tap: (${(xPercent*100).toFixed(1)}%, ${(yPercent*100).toFixed(1)}%)`);
      } catch (e) {
        console.error('[Receiver] Error sending tap:', e);
      }
    }

    // Track last sender for input forwarding
    let lastSenderId = null;

    // Mouse click on video → normalize → send to phone
    remoteVideo.addEventListener('click', (e) => {
      if (!streamActive || !lastSenderId) return;
      const rect = remoteVideo.getBoundingClientRect();
      const xPercent = (e.clientX - rect.left) / rect.width;
      const yPercent = (e.clientY - rect.top) / rect.height;
      sendTapToPhone(xPercent, yPercent, lastSenderId);
    });

    // Mouse move on video → update local cursor position
    remoteVideo.addEventListener('mousemove', (e) => {
      if (!streamActive) return;
      cursorX = e.clientX;
      cursorY = e.clientY;
      tvCursor.style.left = cursorX + 'px';
      tvCursor.style.top = cursorY + 'px';
    });

    // Touch support for TV remotes that emit touch events
    remoteVideo.addEventListener('touchstart', (e) => {
      if (!streamActive || !lastSenderId) return;
      e.preventDefault();
      const touch = e.touches[0];
      const rect = remoteVideo.getBoundingClientRect();
      const xPercent = (touch.clientX - rect.left) / rect.width;
      const yPercent = (touch.clientY - rect.top) / rect.height;
      sendTapToPhone(xPercent, yPercent, lastSenderId);
    }, { passive: false });

    // ─── Cast Channel Message Listener ──────────────────────────
    context.addCustomMessageListener(CUSTOM_NAMESPACE, async (event) => {
      try {
        lastSenderId = event.senderId;
        const payload = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;

        switch (payload.type) {
          case 'offer':
            await handleOffer(payload.sdp, event.senderId);
            break;

          case 'ice_candidate':
            if (pc && payload.candidate) {
              await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
            }
            break;

          case 'stop':
            if (pc) {
              pc.close();
              pc = null;
            }
            streamActive = false;
            remoteVideo.srcObject = null;
            tvCursor.style.display = 'none';
            waitingScreen.style.display = 'flex';
            waitingScreen.style.opacity = '1';
            setDebug('Stopped');
            break;

          case 'cursor_move':
            // Phone trackpad sends relative cursor deltas
            if (streamActive) {
              cursorX = Math.max(0, Math.min(window.innerWidth, cursorX + (payload.dx || 0) * 1.8));
              cursorY = Math.max(0, Math.min(window.innerHeight, cursorY + (payload.dy || 0) * 1.8));
              tvCursor.style.left = cursorX + 'px';
              tvCursor.style.top = cursorY + 'px';
            }
            break;

          case 'click':
            // Phone trackpad sends a click at current cursor position
            if (streamActive && lastSenderId) {
              // Visual feedback: ripple on cursor
              tvCursor.classList.add('clicking');
              setTimeout(() => tvCursor.classList.remove('clicking'), 300);

              const rect = remoteVideo.getBoundingClientRect();
              const xPercent = (cursorX - rect.left) / rect.width;
              const yPercent = (cursorY - rect.top) / rect.height;
              sendTapToPhone(xPercent, yPercent, lastSenderId);
            }
            break;

          case 'swipe':
            // Phone sends swipe events — forward to phone as normalized coordinates
            if (streamActive && lastSenderId) {
              context.sendCustomMessage(CUSTOM_NAMESPACE, lastSenderId, {
                type: 'remote_swipe',
                startXPercent: payload.startXPercent,
                startYPercent: payload.startYPercent,
                endXPercent: payload.endXPercent,
                endYPercent: payload.endYPercent,
                durationMs: payload.durationMs || 300
              });
            }
            break;

          case 'nav_action':
            // Navigation actions are handled by the phone, no TV action needed
            console.log('[Receiver] Nav action:', payload.action);
            break;

          default:
            console.log('[Receiver] Unknown message type:', payload.type);
        }
      } catch (err) {
        console.error('[Receiver] Error handling message:', err);
      }
    });

    // ─── Start Receiver ─────────────────────────────────────────
    context.start();
    setDebug('Ready');
    console.log('[Receiver] Pakkun dumb video sink receiver started');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pakkun Mobile Desktop Shell</title>
  <!-- Google Cast Application Framework (CAF) Receiver SDK -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #1E293B 0%, #0F172A 100%);
      height: 100vh;
      width: 100vw;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #F8FAFC;
    }
    
    /* Desktop Background Canvas Grid */
    #desktopArea {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100vh - 52px);
      overflow-y: auto;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      grid-auto-rows: 120px;
      gap: 16px;
      align-content: start;
    }
    .desktop-app {
      width: 104px;
      height: 112px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      cursor: pointer;
      padding: 6px;
      transition: background 0.2s, transform 0.1s;
    }
    .desktop-app:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
    .app-icon {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #2563EB, #0284C7);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #FFF;
      box-shadow: 0 10px 20px rgba(0,0,0,0.35);
      margin-bottom: 8px;
    }
    .app-label {
      font-size: 12px;
      font-weight: 500;
      color: #F1F5F9;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90px;
    }

    /* Multi-Window Window Manager */
    .window-frame {
      position: absolute;
      background: rgba(30, 41, 59, 0.92);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 380px;
      min-height: 260px;
    }
    .window-frame.active-win {
      border-color: #38BDF8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4), 0 32px 64px rgba(0,0,0,0.75);
    }
    .window-header {
      height: 42px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      cursor: move;
    }
    .window-title {
      font-size: 14px;
      font-weight: 600;
      color: #F1F5F9;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .window-actions {
      display: flex;
      gap: 8px;
    }
    .win-action-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
    }
    .btn-close { background: #EF4444; color: #FFF; }
    .btn-min { background: #F59E0B; color: #FFF; }
    .btn-max { background: #10B981; color: #FFF; }
    
    .window-content {
      flex: 1;
      padding: 16px;
      overflow: auto;
      background: rgba(15, 23, 42, 0.75);
    }

    /* Taskbar & Navigation Dock */
    #taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 52px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 10000;
    }
    .start-trigger {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #2563EB, #0284C7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #FFF;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5);
      cursor: pointer;
    }
    .taskbar-items {
      display: flex;
      gap: 10px;
      flex: 1;
      margin: 0 20px;
      overflow-x: auto;
    }
    .task-item {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 13px;
      color: #CBD5E1;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .task-item.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38BDF8;
      color: #FFF;
      font-weight: 600;
    }
    .sys-dock {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      color: #94A3B8;
      font-family: monospace;
    }

    /* Start Menu Drawer Overlay */
    #startMenuDrawer {
      position: absolute;
      bottom: 60px;
      left: 14px;
      width: 460px;
      height: 540px;
      background: rgba(30, 41, 59, 0.96);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.75);
      z-index: 10001;
      display: none;
      flex-direction: column;
      padding: 20px;
    }
    .start-search-box {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #FFF;
      font-size: 15px;
      outline: none;
      margin-bottom: 20px;
    }
    .start-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      overflow-y: auto;
      flex: 1;
    }

    /* Virtual Mouse Pointer Overlay */
    #virtualCursor {
      position: fixed;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #38BDF8 0%, #2563EB 100%);
      border: 2px solid #FFFFFF;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999999;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      transition: transform 0.05s linear;
    }
    
    #remoteVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background-color: #000;
      z-index: 100;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Desktop Wallpaper & App Shortcuts Area -->
  <div id="desktopArea">
    <div class="desktop-app" data-app-name="Browser" data-app-icon="🌐">
      <div class="app-icon">🌐</div>
      <div class="app-label">Browser</div>
    </div>
    <div class="desktop-app" data-app-name="Files" data-app-icon="📁">
      <div class="app-icon" style="background: linear-gradient(135deg, #10B981, #059669);">📁</div>
      <div class="app-label">Files</div>
    </div>
    <div class="desktop-app" data-app-name="Calculator" data-app-icon="🧮">
      <div class="app-icon" style="background: linear-gradient(135deg, #F59E0B, #D97706);">🧮</div>
      <div class="app-label">Calculator</div>
    </div>
    <div class="desktop-app" data-app-name="Notes" data-app-icon="📝">
      <div class="app-icon" style="background: linear-gradient(135deg, #8B5CF6, #7C3AED);">📝</div>
      <div class="app-label">Notes</div>
    </div>
    <div class="desktop-app" data-app-name="Settings" data-app-icon="⚙️">
      <div class="app-icon" style="background: linear-gradient(135deg, #64748B, #475569);">⚙️</div>
      <div class="app-label">Settings</div>
    </div>
  </div>

  <!-- Start Menu Drawer -->
  <div id="startMenuDrawer">
    <input type="text" id="startSearchInput" class="start-search-box" placeholder="Search installed apps..." onkeyup="filterApps()" />
    <div class="start-grid" id="startGrid">
      <div class="desktop-app" data-app-name="Browser" data-app-icon="🌐"><div class="app-icon">🌐</div><div class="app-label">Browser</div></div>
      <div class="desktop-app" data-app-name="Files" data-app-icon="📁"><div class="app-icon" style="background: linear-gradient(135deg, #10B981, #059669);">📁</div><div class="app-label">Files</div></div>
      <div class="desktop-app" data-app-name="Calculator" data-app-icon="🧮"><div class="app-icon" style="background: linear-gradient(135deg, #F59E0B, #D97706);">🧮</div><div class="app-label">Calculator</div></div>
      <div class="desktop-app" data-app-name="Notes" data-app-icon="📝"><div class="app-icon" style="background: linear-gradient(135deg, #8B5CF6, #7C3AED);">📝</div><div class="app-label">Notes</div></div>
      <div class="desktop-app" data-app-name="Settings" data-app-icon="⚙️"><div class="app-icon" style="background: linear-gradient(135deg, #64748B, #475569);">⚙️</div><div class="app-label">Settings</div></div>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div class="start-trigger" id="startTrigger">P</div>
    <div class="taskbar-items" id="taskbarItems"></div>
    <div class="sys-dock">
      <span>📶 5G</span>
      <span>🔋 100%</span>
      <span id="sysClock">12:00 PM</span>
    </div>
  </div>

  <!-- Virtual Mouse Cursor Pointer -->
  <div id="virtualCursor" style="top: 50vh; left: 50vw;"></div>

  <!-- Screen Stream Overlay -->
  <video id="remoteVideo" autoplay playsinline></video>

  <script>
    const CUSTOM_NAMESPACE = 'urn:x-cast:com.pakkun.channel';
    const context = cast.framework.CastReceiverContext.getInstance();
    const virtualCursor = document.getElementById('virtualCursor');
    const startMenuDrawer = document.getElementById('startMenuDrawer');
    const startSearchInput = document.getElementById('startSearchInput');
    const startGrid = document.getElementById('startGrid');
    const desktopArea = document.getElementById('desktopArea');
    const taskbarItems = document.getElementById('taskbarItems');
    const sysClock = document.getElementById('sysClock');
    const remoteVideo = document.getElementById('remoteVideo');

    let cursorX = window.innerWidth / 2;
    let cursorY = window.innerHeight / 2;
    let windowIdCounter = 0;
    let installedPhoneApps = [];

    // Live Clock
    setInterval(() => {
      const now = new Date();
      sysClock.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    function toggleStartMenu() {
      const isOpen = startMenuDrawer.style.display === 'flex';
      startMenuDrawer.style.display = isOpen ? 'none' : 'flex';
      if (!isOpen) startSearchInput.focus();
    }

    function filterApps() {
      const query = startSearchInput.value.toLowerCase();
      const apps = startGrid.getElementsByClassName('desktop-app');
      for (let app of apps) {
        const label = app.innerText.toLowerCase();
        app.style.display = label.includes(query) ? 'flex' : 'none';
      }
    }

    function renderInstalledApps(apps) {
      if (!apps || !apps.length) return;
      installedPhoneApps = apps;
      console.log('Rendering', apps.length, 'installed phone apps in desktop shell');

      // Populate Start Menu App Grid
      startGrid.innerHTML = '';
      apps.forEach(app => {
        const appEl = document.createElement('div');
        appEl.className = 'desktop-app';
        appEl.setAttribute('data-app-name', app.name);
        appEl.setAttribute('data-app-pkg', app.packageName);
        appEl.setAttribute('data-app-icon', '📱');

        // Color coding based on app name hash
        let hash = 0;
        for (let i = 0; i < app.name.length; i++) hash = app.name.charCodeAt(i) + ((hash << 5) - hash);
        const hue = Math.abs(hash) % 360;

        appEl.innerHTML = `
          <div class="app-icon" style="background: linear-gradient(135deg, hsl(${hue}, 70%, 50%), hsl(${(hue+40)%360}, 80%, 40%));">📱</div>
          <div class="app-label">${app.name}</div>
        `;
        startGrid.appendChild(appEl);
      });
    }

    function openApp(name, icon) {
      startMenuDrawer.style.display = 'none';
      windowIdCounter++;
      const winId = `win_${windowIdCounter}`;

      const winEl = document.createElement('div');
      winEl.className = 'window-frame active-win';
      winEl.id = winId;
      winEl.style.width = '680px';
      winEl.style.height = '460px';
      winEl.style.left = `${140 + ((windowIdCounter % 10) * 24)}px`;
      winEl.style.top = `${80 + ((windowIdCounter % 10) * 24)}px`;
      winEl.style.zIndex = 100 + windowIdCounter;

      let bodyHtml = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
          <div style="font-size:48px; margin-bottom:12px;">${icon}</div>
          <div style="color:#F1F5F9; font-size:20px; font-weight:bold; margin-bottom:8px;">${name}</div>
          <div style="color:#94A3B8; font-size:14px;">Mobile Desktop Window Instance</div>
        </div>`;

      if (name === 'Browser') {
        bodyHtml = `
          <div style="display:flex; flex-direction:column; height:100%;">
            <input id="browserUrl" type="text" value="https://google.com" style="width:100%; padding:8px 12px; background:rgba(15,23,42,0.8); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#FFF; margin-bottom:10px;" />
            <iframe src="https://wikipedia.org" style="width:100%; flex:1; border:none; border-radius:8px; background:#FFF;"></iframe>
          </div>`;
      } else if (name === 'Calculator') {
        bodyHtml = `
          <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
            <input id="calcDisplay" style="grid-column: span 4; height:48px; font-size:24px; text-align:right; padding:10px; background:rgba(15,23,42,0.8); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#FFF;" readonly value="0" />
            <button onclick="calc('7')" style="padding:16px; font-size:18px;">7</button><button onclick="calc('8')" style="padding:16px; font-size:18px;">8</button><button onclick="calc('9')" style="padding:16px; font-size:18px;">9</button><button onclick="calc('/')" style="padding:16px; font-size:18px;">/</button>
            <button onclick="calc('4')" style="padding:16px; font-size:18px;">4</button><button onclick="calc('5')" style="padding:16px; font-size:18px;">5</button><button onclick="calc('6')" style="padding:16px; font-size:18px;">6</button><button onclick="calc('*')" style="padding:16px; font-size:18px;">*</button>
            <button onclick="calc('1')" style="padding:16px; font-size:18px;">1</button><button onclick="calc('2')" style="padding:16px; font-size:18px;">2</button><button onclick="calc('3')" style="padding:16px; font-size:18px;">3</button><button onclick="calc('-')" style="padding:16px; font-size:18px;">-</button>
            <button onclick="calc('0')" style="padding:16px; font-size:18px;">0</button><button onclick="calc('C')" style="padding:16px; font-size:18px;">C</button><button onclick="calc('=')" style="padding:16px; font-size:18px;">=</button><button onclick="calc('+')" style="padding:16px; font-size:18px;">+</button>
          </div>`;
      } else if (name === 'Notes') {
        bodyHtml = `<textarea id="notesArea" style="width:100%; height:100%; background:transparent; color:#FFF; border:none; outline:none; font-size:16px; resize:none;" placeholder="Type notes using phone keyboard..."></textarea>`;
      }

      winEl.innerHTML = `
        <div class="window-header">
          <div class="window-title"><span>${icon}</span> <span>${name}</span></div>
          <div class="window-actions">
            <div class="win-action-btn btn-min" data-win-id="${winId}">-</div>
            <div class="win-action-btn btn-max" data-win-id="${winId}">□</div>
            <div class="win-action-btn btn-close" data-win-id="${winId}">✕</div>
          </div>
        </div>
        <div class="window-content">${bodyHtml}</div>
      `;

      document.body.appendChild(winEl);
      focusWindow(winId);

      // Add to taskbar
      const pill = document.createElement('div');
      pill.className = 'task-item active';
      pill.id = `pill_${winId}`;
      pill.setAttribute('data-win-id', winId);
      pill.innerHTML = `<span>${icon}</span> <span>${name}</span>`;
      taskbarItems.appendChild(pill);
    }

    function focusWindow(winId) {
      document.querySelectorAll('.window-frame').forEach(w => w.classList.remove('active-win'));
      document.querySelectorAll('.task-item').forEach(p => p.classList.remove('active'));

      const win = document.getElementById(winId);
      if (win) {
        win.style.display = 'flex';
        win.classList.add('active-win');
        win.style.zIndex = 200 + windowIdCounter++;
      }
      const pill = document.getElementById(`pill_${winId}`);
      if (pill) pill.classList.add('active');
    }

    function closeWindow(winId) {
      console.log('Closing window:', winId);
      const win = document.getElementById(winId);
      if (win) win.remove();
      const pill = document.getElementById(`pill_${winId}`);
      if (pill) pill.remove();
    }

    function minimizeWindow(winId) {
      const win = document.getElementById(winId);
      if (win) win.style.display = 'none';
      const pill = document.getElementById(`pill_${winId}`);
      if (pill) pill.classList.remove('active');
    }

    function maximizeWindow(winId) {
      const win = document.getElementById(winId);
      if (win) {
        if (win.style.width === '100vw') {
          win.style.width = '680px';
          win.style.height = '460px';
          win.style.left = '140px';
          win.style.top = '80px';
        } else {
          win.style.width = '100vw';
          win.style.height = 'calc(100vh - 52px)';
          win.style.left = '0';
          win.style.top = '0';
        }
      }
    }

    function calc(val) {
      const display = document.getElementById('calcDisplay');
      if (!display) return;
      if (val === 'C') display.value = '0';
      else if (val === '=') {
        try { display.value = eval(display.value); } catch(e) { display.value = 'Error'; }
      } else {
        if (display.value === '0') display.value = val;
        else display.value += val;
      }
    }

    // Bulletproof Virtual Mouse Click Handler
    function handleVirtualClick(x, y) {
      let target = document.elementFromPoint(x, y);
      console.log('Virtual click target:', target);

      while (target && target !== document.body) {
        // Start trigger
        if (target.id === 'startTrigger' || target.classList.contains('start-trigger')) {
          toggleStartMenu();
          return;
        }
        // Window Control Buttons
        if (target.classList && target.classList.contains('win-action-btn')) {
          const winId = target.getAttribute('data-win-id');
          if (target.classList.contains('btn-close')) closeWindow(winId);
          else if (target.classList.contains('btn-min')) minimizeWindow(winId);
          else if (target.classList.contains('btn-max')) maximizeWindow(winId);
          return;
        }
        // Taskbar Items
        if (target.classList && target.classList.contains('task-item')) {
          const winId = target.getAttribute('data-win-id');
          if (winId) focusWindow(winId);
          return;
        }
        // Desktop App Shortcut Launcher
        if (target.classList && target.classList.contains('desktop-app')) {
          const name = target.getAttribute('data-app-name') || 'App';
          const icon = target.getAttribute('data-app-icon') || '📱';
          openApp(name, icon);
          return;
        }
        // Window Focus
        if (target.classList && target.classList.contains('window-frame')) {
          focusWindow(target.id);
          return;
        }
        // Standard native onclick
        if (target.onclick) {
          target.onclick();
          return;
        }
        target = target.parentElement;
      }
    }

    // Cast Messaging Receiver
    context.addCustomMessageListener(CUSTOM_NAMESPACE, async (event) => {
      try {
        const payload = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;

        if (payload.type === 'set_installed_apps') {
          renderInstalledApps(payload.apps);
        }
        else if (payload.type === 'cursor_move') {
          cursorX = Math.max(0, Math.min(window.innerWidth, cursorX + payload.dx * 1.8));
          cursorY = Math.max(0, Math.min(window.innerHeight, cursorY + payload.dy * 1.8));
          virtualCursor.style.left = `${cursorX}px`;
          virtualCursor.style.top = `${cursorY}px`;
        }
        else if (payload.type === 'click') {
          handleVirtualClick(cursorX, cursorY);
        }
        else if (payload.type === 'search_query') {
          startMenuDrawer.style.display = 'flex';
          startSearchInput.value = payload.query;
          filterApps();
        }
        else if (payload.type === 'launch_app') {
          openApp(payload.name, payload.icon || '📱');
        }
        else if (payload.type === 'type_text') {
          const activeInput = document.querySelector('.active-win textarea, .active-win input');
          if (activeInput) activeInput.value = payload.text;
        }
      } catch (err) {
        console.error('Error handling desktop message:', err);
      }
    });

    context.start();
  </script>
</body>
</html>

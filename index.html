<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pakkun Mobile Desktop Shell</title>
  <!-- Google Cast Application Framework (CAF) Receiver SDK -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #1E293B 0%, #0F172A 100%);
      height: 100vh;
      width: 100vw;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #F8FAFC;
    }
    
    /* Desktop Background Canvas */
    #desktopArea {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100vh - 52px);
      overflow: hidden;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      grid-auto-rows: 110px;
      gap: 16px;
      align-content: start;
    }
    .desktop-app {
      width: 96px;
      height: 104px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .desktop-app:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
    .app-icon {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #2563EB, #3B82F6);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.35);
      margin-bottom: 8px;
    }
    .app-label {
      font-size: 13px;
      font-weight: 500;
      color: #F1F5F9;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Multi-Window Window Manager */
    .window-frame {
      position: absolute;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 360px;
      min-height: 240px;
      transition: box-shadow 0.2s;
    }
    .window-frame.active-win {
      border-color: #38BDF8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4), 0 32px 64px rgba(0,0,0,0.7);
    }
    .window-header {
      height: 40px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: move;
    }
    .window-title {
      font-size: 14px;
      font-weight: 600;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .window-actions {
      display: flex;
      gap: 8px;
    }
    .win-action-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
    }
    .btn-close { background: #EF4444; color: #7F1D1D; }
    .btn-min { background: #F59E0B; color: #78350F; }
    .btn-max { background: #10B981; color: #064E3B; }
    
    .window-content {
      flex: 1;
      padding: 16px;
      overflow: auto;
      background: rgba(15, 23, 42, 0.7);
    }

    /* Taskbar & Navigation Dock */
    #taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 52px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 10000;
    }
    .start-trigger {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #2563EB, #0284C7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #FFF;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5);
      cursor: pointer;
    }
    .taskbar-items {
      display: flex;
      gap: 10px;
      flex: 1;
      margin: 0 20px;
      overflow-x: auto;
    }
    .task-item {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 13px;
      color: #CBD5E1;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .task-item.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38BDF8;
      color: #FFF;
      font-weight: 600;
    }
    .sys-dock {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      color: #94A3B8;
      font-family: monospace;
    }

    /* Start Menu Drawer Overlay */
    #startMenuDrawer {
      position: absolute;
      bottom: 60px;
      left: 14px;
      width: 420px;
      height: 520px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.7);
      z-index: 10001;
      display: none;
      flex-direction: column;
      padding: 20px;
    }
    .start-search-box {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #FFF;
      font-size: 15px;
      outline: none;
      margin-bottom: 20px;
    }
    .start-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      overflow-y: auto;
      flex: 1;
    }

    /* Virtual Mouse Pointer Overlay */
    #virtualCursor {
      position: fixed;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #38BDF8 0%, #2563EB 100%);
      border: 2px solid #FFFFFF;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999999;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      transition: transform 0.05s linear;
    }
    
    #remoteVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background-color: #000;
      z-index: 100;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Desktop Wallpaper & App Shortcuts -->
  <div id="desktopArea">
    <div class="desktop-app" onclick="openApp('Browser', '🌐')">
      <div class="app-icon">🌐</div>
      <div class="app-label">Browser</div>
    </div>
    <div class="desktop-app" onclick="openApp('Files', '📁')">
      <div class="app-icon" style="background: linear-gradient(135deg, #10B981, #059669);">📁</div>
      <div class="app-label">Files</div>
    </div>
    <div class="desktop-app" onclick="openApp('Calculator', '🧮')">
      <div class="app-icon" style="background: linear-gradient(135deg, #F59E0B, #D97706);">🧮</div>
      <div class="app-label">Calculator</div>
    </div>
    <div class="desktop-app" onclick="openApp('Notes', '📝')">
      <div class="app-icon" style="background: linear-gradient(135deg, #8B5CF6, #7C3AED);">📝</div>
      <div class="app-label">Notes</div>
    </div>
    <div class="desktop-app" onclick="openApp('Settings', '⚙️')">
      <div class="app-icon" style="background: linear-gradient(135deg, #64748B, #475569);">⚙️</div>
      <div class="app-label">Settings</div>
    </div>
  </div>

  <!-- Start Menu Drawer -->
  <div id="startMenuDrawer">
    <input type="text" id="startSearchInput" class="start-search-box" placeholder="Search apps (or type on phone)..." onkeyup="filterApps()" />
    <div class="start-grid" id="startGrid">
      <div class="desktop-app" onclick="openApp('Browser', '🌐')"><div class="app-icon">🌐</div><div class="app-label">Browser</div></div>
      <div class="desktop-app" onclick="openApp('Files', '📁')"><div class="app-icon" style="background: linear-gradient(135deg, #10B981, #059669);">📁</div><div class="app-label">Files</div></div>
      <div class="desktop-app" onclick="openApp('Calculator', '🧮')"><div class="app-icon" style="background: linear-gradient(135deg, #F59E0B, #D97706);">🧮</div><div class="app-label">Calculator</div></div>
      <div class="desktop-app" onclick="openApp('Notes', '📝')"><div class="app-icon" style="background: linear-gradient(135deg, #8B5CF6, #7C3AED);">📝</div><div class="app-label">Notes</div></div>
      <div class="desktop-app" onclick="openApp('Settings', '⚙️')"><div class="app-icon" style="background: linear-gradient(135deg, #64748B, #475569);">⚙️</div><div class="app-label">Settings</div></div>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div class="start-trigger" onclick="toggleStartMenu()">P</div>
    <div class="taskbar-items" id="taskbarItems"></div>
    <div class="sys-dock">
      <span>📶 5G</span>
      <span>🔋 100%</span>
      <span id="sysClock">12:00 PM</span>
    </div>
  </div>

  <!-- Virtual Mouse Cursor Pointer -->
  <div id="virtualCursor" style="top: 50vh; left: 50vw;"></div>

  <!-- WebRTC Stream Video Overlay -->
  <video id="remoteVideo" autoplay playsinline></video>

  <script>
    const CUSTOM_NAMESPACE = 'urn:x-cast:com.pakkun.channel';
    const context = cast.framework.CastReceiverContext.getInstance();
    const virtualCursor = document.getElementById('virtualCursor');
    const startMenuDrawer = document.getElementById('startMenuDrawer');
    const startSearchInput = document.getElementById('startSearchInput');
    const startGrid = document.getElementById('startGrid');
    const taskbarItems = document.getElementById('taskbarItems');
    const sysClock = document.getElementById('sysClock');
    const remoteVideo = document.getElementById('remoteVideo');

    let cursorX = window.innerWidth / 2;
    let cursorY = window.innerHeight / 2;
    let windowIdCounter = 0;
    let activeWindowId = null;

    // Live System Clock
    setInterval(() => {
      const now = new Date();
      sysClock.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    function toggleStartMenu() {
      const isOpen = startMenuDrawer.style.display === 'flex';
      startMenuDrawer.style.display = isOpen ? 'none' : 'flex';
      if (!isOpen) startSearchInput.focus();
    }

    function filterApps() {
      const query = startSearchInput.value.toLowerCase();
      const apps = startGrid.getElementsByClassName('desktop-app');
      for (let app of apps) {
        const label = app.innerText.toLowerCase();
        app.style.display = label.includes(query) ? 'flex' : 'none';
      }
    }

    function openApp(name, icon) {
      startMenuDrawer.style.display = 'none';
      windowIdCounter++;
      const winId = `win_${windowIdCounter}`;

      const winEl = document.createElement('div');
      winEl.className = 'window-frame active-win';
      winEl.id = winId;
      winEl.style.width = '640px';
      winEl.style.height = '440px';
      winEl.style.left = `${120 + (windowIdCounter * 24)}px`;
      winEl.style.top = `${80 + (windowIdCounter * 24)}px`;
      winEl.style.zIndex = 100 + windowIdCounter;

      let bodyHtml = `<div style="color:#CBD5E1; font-size:16px;">Running ${name}...</div>`;
      if (name === 'Browser') {
        bodyHtml = `
          <div style="display:flex; flex-direction:column; height:100%;">
            <input id="browserUrl" type="text" value="https://google.com" style="width:100%; padding:8px 12px; background:rgba(15,23,42,0.8); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#FFF; margin-bottom:10px;" />
            <iframe src="https://wikipedia.org" style="width:100%; flex:1; border:none; border-radius:8px; background:#FFF;"></iframe>
          </div>`;
      } else if (name === 'Calculator') {
        bodyHtml = `
          <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
            <input id="calcDisplay" style="grid-column: span 4; height:48px; font-size:24px; text-align:right; padding:10px; background:rgba(15,23,42,0.8); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#FFF;" readonly value="0" />
            <button onclick="calc('7')" style="padding:16px; font-size:18px;">7</button><button onclick="calc('8')" style="padding:16px; font-size:18px;">8</button><button onclick="calc('9')" style="padding:16px; font-size:18px;">9</button><button onclick="calc('/')" style="padding:16px; font-size:18px;">/</button>
            <button onclick="calc('4')" style="padding:16px; font-size:18px;">4</button><button onclick="calc('5')" style="padding:16px; font-size:18px;">5</button><button onclick="calc('6')" style="padding:16px; font-size:18px;">6</button><button onclick="calc('*')" style="padding:16px; font-size:18px;">*</button>
            <button onclick="calc('1')" style="padding:16px; font-size:18px;">1</button><button onclick="calc('2')" style="padding:16px; font-size:18px;">2</button><button onclick="calc('3')" style="padding:16px; font-size:18px;">3</button><button onclick="calc('-')" style="padding:16px; font-size:18px;">-</button>
            <button onclick="calc('0')" style="padding:16px; font-size:18px;">0</button><button onclick="calc('C')" style="padding:16px; font-size:18px;">C</button><button onclick="calc('=')" style="padding:16px; font-size:18px;">=</button><button onclick="calc('+')" style="padding:16px; font-size:18px;">+</button>
          </div>`;
      } else if (name === 'Notes') {
        bodyHtml = `<textarea id="notesArea" style="width:100%; height:100%; background:transparent; color:#FFF; border:none; outline:none; font-size:16px; resize:none;" placeholder="Type notes using phone keyboard..."></textarea>`;
      }

      winEl.innerHTML = `
        <div class="window-header" onclick="focusWindow('${winId}')">
          <div class="window-title">${icon} ${name}</div>
          <div class="window-actions">
            <div class="win-action-btn btn-min" onclick="minimizeWindow('${winId}')">-</div>
            <div class="win-action-btn btn-max" onclick="maximizeWindow('${winId}')">□</div>
            <div class="win-action-btn btn-close" onclick="closeWindow('${winId}')">✕</div>
          </div>
        </div>
        <div class="window-content">${bodyHtml}</div>
      `;

      document.body.appendChild(winEl);
      focusWindow(winId);

      // Taskbar pill
      const pill = document.createElement('div');
      pill.className = 'task-item active';
      pill.id = `pill_${winId}`;
      pill.onclick = () => focusWindow(winId);
      pill.innerHTML = `<span>${icon}</span> <span>${name}</span>`;
      taskbarItems.appendChild(pill);
    }

    function focusWindow(winId) {
      activeWindowId = winId;
      document.querySelectorAll('.window-frame').forEach(w => w.classList.remove('active-win'));
      document.querySelectorAll('.task-item').forEach(p => p.classList.remove('active'));

      const win = document.getElementById(winId);
      if (win) {
        win.classList.add('active-win');
        win.style.zIndex = 200 + windowIdCounter++;
      }
      const pill = document.getElementById(`pill_${winId}`);
      if (pill) pill.classList.add('active');
    }

    function closeWindow(winId) {
      const win = document.getElementById(winId);
      if (win) win.remove();
      const pill = document.getElementById(`pill_${winId}`);
      if (pill) pill.remove();
    }

    function minimizeWindow(winId) {
      const win = document.getElementById(winId);
      if (win) win.style.display = 'none';
      const pill = document.getElementById(`pill_${winId}`);
      if (pill) pill.classList.remove('active');
    }

    function maximizeWindow(winId) {
      const win = document.getElementById(winId);
      if (win) {
        if (win.style.width === '100vw') {
          win.style.width = '640px';
          win.style.height = '440px';
          win.style.left = '120px';
          win.style.top = '80px';
        } else {
          win.style.width = '100vw';
          win.style.height = 'calc(100vh - 52px)';
          win.style.left = '0';
          win.style.top = '0';
        }
      }
    }

    function calc(val) {
      const display = document.getElementById('calcDisplay');
      if (!display) return;
      if (val === 'C') display.value = '0';
      else if (val === '=') {
        try { display.value = eval(display.value); } catch(e) { display.value = 'Error'; }
      } else {
        if (display.value === '0') display.value = val;
        else display.value += val;
      }
    }

    // Cast Custom Messaging Protocol Receiver
    context.addCustomMessageListener(CUSTOM_NAMESPACE, async (event) => {
      try {
        const payload = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;

        if (payload.type === 'cursor_move') {
          cursorX = Math.max(0, Math.min(window.innerWidth, cursorX + payload.dx * 1.8));
          cursorY = Math.max(0, Math.min(window.innerHeight, cursorY + payload.dy * 1.8));
          virtualCursor.style.left = `${cursorX}px`;
          virtualCursor.style.top = `${cursorY}px`;
        }
        else if (payload.type === 'click') {
          const target = document.elementFromPoint(cursorX, cursorY);
          if (target) target.click();
        }
        else if (payload.type === 'search_query') {
          startMenuDrawer.style.display = 'flex';
          startSearchInput.value = payload.query;
          filterApps();
        }
        else if (payload.type === 'launch_app') {
          openApp(payload.name, payload.icon || '📱');
        }
        else if (payload.type === 'type_text') {
          const activeArea = document.querySelector('.active-win textarea, .active-win input');
          if (activeArea) activeArea.value = payload.text;
        }
      } catch (err) {
        console.error('Error handling trackpad message:', err);
      }
    });

    context.start();
  </script>
</body>
</html>
